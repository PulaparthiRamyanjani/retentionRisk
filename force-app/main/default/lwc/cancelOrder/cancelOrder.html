<template>
    <lightning-card title="Cancel Order Confirmation">
        <div class="slds-p-around_medium">
            <p>Are you sure you want to cancel this order? All items will be canceled.</p>
            <lightning-button variant="neutral" label="Cancel" onclick={handleBackToOrder}></lightning-button>
            <lightning-button variant="destructive" label="Continue" onclick={handleConfirmCancelOrder}></lightning-button>
        </div>
        <template if:true={errorMessage}>
            <p class="slds-text-color_error">{errorMessage}</p>
        </template>
    </lightning-card>
</template>
