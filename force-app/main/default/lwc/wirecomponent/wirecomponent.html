<template>
    <lightning-card title="Accounts" icon-name="standard:account">
        <template if:true={accounts.data}>
            <lightning-datatable
                key-field="Id"
                data={accounts.data}
                columns={columns}
                hide-checkbox-column
                class="slds-m-around_medium">
            </lightning-datatable>
        </template>
        <template if:true={accounts.error}>
            <p>Error: {accounts.error}</p>
        </template>
    </lightning-card>
</template>
