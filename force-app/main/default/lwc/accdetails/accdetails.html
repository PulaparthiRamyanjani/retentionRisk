<template>
    <lightning-card title="Related Accounts" icon-name="standard:account">
        <template if:true={hasAccounts}>
            <lightning-datatable
                key-field="Id"
                data={accounts.data}
                columns={columns}
                class="slds-m-around_medium">
            </lightning-datatable>
        </template>
        <template if:false={hasAccounts}>
            <p>No accounts found.</p>
        </template>
    </lightning-card>
</template>
