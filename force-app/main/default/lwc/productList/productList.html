<template>
    <lightning-card>
        <lightning-layout multiple-rows>
            <template for:each={products} for:item="product">
                <lightning-layout-item key={product.productId} size="4" class="slds-p-around_small">
                    <div class="product-card">
                        <a
                            onclick={handleProductClick}
                            data-product-image-id={product.productImageId}> <!-- Ensure this matches your JS -->
                            <img src={product.heroImageUrl} alt={product.productName} class="hero-image" />
                            <h2>{product.productName}</h2>
                        </a>
                        <p>{product.productDescription}</p>
                        <p>Price: ${product.productPrice}</p>
                        <p>Status: {product.stockStatus}</p>
                        <div class="quantity-wrapper">
                            <button data-id={product.productId} onclick={decreaseQuantity}>-</button>
                            <input type="number" value={product.quantity} class="quantity-input" min="1" />
                            <button data-id={product.productId} onclick={increaseQuantity}>+</button>
                        </div>
                        <lightning-button label="Add to Cart" data-id={product.productId} onclick={addToCart}></lightning-button>
                        <lightning-button label="Go to Cart" data-id={product.productId} onclick={goToCart}></lightning-button>
                    </div>
                </lightning-layout-item>
            </template>
        </lightning-layout>
    </lightning-card>
</template>
