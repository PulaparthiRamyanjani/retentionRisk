<template>
    <lightning-card title="Related Contacts" icon-name="standard:contact">
        <template if:true={contacts.data}>
            <lightning-datatable
                key-field="Id"
                data={contacts.data}
                columns={columns}
                class="slds-m-around_medium">
            </lightning-datatable>
        </template>
        <template if:true={contacts.error}>
            <p>Error: {contacts.error}</p>
        </template>
    </lightning-card>
</template>
