<template>
    <template if:true={product}>
        <lightning-card title={product.productName} icon-name="custom:custom63">
            <div class="slds-p-horizontal_medium">
                <!-- Lightning Carousel to display product images -->
                <lightning-carousel autoplay="false" slides-to-show="1">
                    <template for:each={product.images} for:item="image">
                        <lightning-carousel-image
                            key={image.url}
                            src={image.url}
                            alt={product.productName}
                            title={product.productName}>
                        </lightning-carousel-image>
                    </template>
                </lightning-carousel>
 
                <p>Price: ${product.productPrice}</p>
                <p>Status: {stockStatus}</p> <!-- Use the getter here -->
                <p>Description: {product.productDescription}</p>
 
                <!-- Add quantity control -->
                <div class="quantity-wrapper">
                    <button onclick={decreaseQuantity}>-</button>
                    <input type="number" value={quantity} class="quantity-input" min="1" />
                    <button onclick={increaseQuantity}>+</button>
                </div>
 
                <!-- Add to Cart Button -->
                <lightning-button label="Add to Cart" onclick={addToCart}></lightning-button>
 
            </div>
        </lightning-card>
    </template>
 
    <template if:true={error}>
        <lightning-card title="Error" icon-name="utility:error">
            <div class="slds-p-horizontal_medium">
                <p>Error loading product details: {error.message}</p>
            </div>
        </lightning-card>
    </template>
 
    <template if:true={isLoading}>
        <lightning-card title="Loading..." icon-name="utility:loading">
            <div class="slds-p-horizontal_medium">
                <p>Loading product details...</p>
            </div>
        </lightning-card>
    </template>
</template>
