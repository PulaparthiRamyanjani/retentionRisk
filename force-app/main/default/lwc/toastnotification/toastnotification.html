<template>
    <lightning-card title="Contact Form">
        <div class="slds-p-around_medium">
            <lightning-input
                label="Phone Number"
                value={phoneNumber}
                onchange={handlePhoneNumberChange}
                required>
            </lightning-input>

            <lightning-input
                label="Email"
                value={email}
                onchange={handleEmailChange}
                required>
            </lightning-input>

            <lightning-button
                label="Submit"
                onclick={handleSubmit}
                class="slds-m-top_medium">
            </lightning-button>
        </div>
    </lightning-card>
</template>
