<template>
    <lightning-card title="Order Address">
        <div class="slds-m-around_medium">
            <lightning-input
                label="Shipping Address"
                value={shippingAddress}
                onchange={handleInputChange}
                data-id="shippingAddress">
            </lightning-input>
 
            <lightning-input
                label="Billing Address"
                value={billingAddress}
                onchange={handleInputChange}
                data-id="billingAddress">
            </lightning-input>
 
            <lightning-button
                label="Save"
                onclick={handleSave}
                class="slds-m-top_medium">
            </lightning-button>
        </div>
    </lightning-card>
</template>
